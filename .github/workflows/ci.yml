name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: nodeforge-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@8207627 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Install integration fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          for fixture in \
            node-ts-eslint \
            node-ts-with-errors \
            node-ts-biome-lint \
            node-ts-jest \
            node-ts-vitest
          do
            pnpm --dir "packages/test-fixtures/$fixture" install --no-frozen-lockfile --ignore-scripts
          done

      - name: Start Xvfb for VS Code extension-host tests
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/nodeforge-xvfb.log 2>&1 &
          echo $! > /tmp/nodeforge-xvfb.pid
          for _ in {1..20}; do
            if kill -0 "$(cat /tmp/nodeforge-xvfb.pid)" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          kill -0 "$(cat /tmp/nodeforge-xvfb.pid)"
      - run: pnpm test
        env:
          DISPLAY: ":99.0"
      - run: pnpm build
      - run: pnpm package
      - name: Verify VSIX artifact
        shell: bash
        run: |
          set -euo pipefail
          vsix="$(find packages/extension -maxdepth 1 -type f -name '*.vsix' -print -quit)"
          test -n "$vsix"
          unzip -l "$vsix" | grep -q 'extension/package.json'
          unzip -l "$vsix" | grep -q 'extension/dist/extension.cjs'
