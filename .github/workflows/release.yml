name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: nodeforge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches extension version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./packages/extension/package.json").version')"
          test "$tag" = "$version"

      - run: pnpm lint
      - run: pnpm typecheck
      - name: Install integration fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          for fixture in \
            node-ts-eslint \
            node-ts-with-errors \
            node-ts-biome-lint \
            node-ts-jest \
            node-ts-vitest
          do
            pnpm --dir "packages/test-fixtures/$fixture" install --no-frozen-lockfile --ignore-scripts --no-audit --no-fund
          done

      - name: Start Xvfb for VS Code extension-host tests
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/nodeforge-xvfb.log 2>&1 &
          echo $! > /tmp/nodeforge-xvfb.pid
          for _ in {1..20}; do
            if kill -0 "$(cat /tmp/nodeforge-xvfb.pid)" 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          kill -0 "$(cat /tmp/nodeforge-xvfb.pid)"
      - run: pnpm test
        env:
          DISPLAY: ":99.0"
      - run: pnpm build
      - run: pnpm package

      - name: Verify VSIX
        shell: bash
        run: |
          set -euo pipefail
          vsix="$(find packages/extension -maxdepth 1 -type f -name '*.vsix' -print -quit)"
          test -n "$vsix"
          unzip -t "$vsix" >/dev/null
          unzip -l "$vsix" | grep -q 'extension/package.json'
          unzip -l "$vsix" | grep -q 'extension/dist/extension.cjs'
          sha256sum "$vsix" > "${vsix}.sha256"

      - name: Attest VSIX provenance
        uses: actions/attest@v4.2.1
        with:
          subject-path: packages/extension/*.vsix

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          vsix="$(find packages/extension -maxdepth 1 -type f -name '*.vsix' -print -quit)"
          gh release create "${GITHUB_REF_NAME}" "$vsix" "${vsix}.sha256"             --title "NodeForge ${GITHUB_REF_NAME}"             --generate-notes
